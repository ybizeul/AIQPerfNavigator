server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Trust only the TCP hop in front of this container (ingress/proxy on
    # private networks). Prefer replacing these with the cluster pod/node CIDR.
    # Do not use $remote_addr for rate limits or allow/deny until that is done.
    # After this, the default access log's $remote_addr is the X-Forwarded-For
    # client; $realip_remote_addr remains the connecting proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Kubernetes liveness/readiness: cheap 200, omitted from access logs.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
