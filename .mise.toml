# mise configuration for AIQ Performance Browser
# https://mise.jdx.dev/

[tools]
# Bun is the package manager, script runtime, and HTML/React bundler.
bun = "1.4.0"

[tasks.install]
description = "Install project dependencies"
run = "bun install"

[tasks.dev]
description = "Start development server"
run = "bun run dev"

[tasks.build]
description = "Build for production"
run = "bun run build"

[tasks.lint]
description = "Run oxlint"
run = "bun run lint"

[tasks.preview]
description = "Preview production build"
run = "bun run preview"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "bunx tsc -b"

[tasks.clean]
description = "Clean build artifacts and dependencies"
run = """
rm -rf dist
rm -rf node_modules
"""

[tasks.reset]
description = "Clean and reinstall dependencies"
depends = ["clean", "install"]

[env]
_.file = ".env"
_.path = ".env.local"
