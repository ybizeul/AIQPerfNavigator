<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIQ Perf Navigator</title>
    <script>
      // Mirrors Mantine's ColorSchemeScript, which cannot be used in a client-only app:
      // sets the attribute before first paint so dark mode does not flash light.
      try {
        var stored = window.localStorage.getItem('mantine-color-scheme-value')
        var scheme =
          stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto'
        document.documentElement.setAttribute(
          'data-mantine-color-scheme',
          scheme !== 'auto'
            ? scheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light',
        )
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
